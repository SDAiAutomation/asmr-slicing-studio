name: Render ASMR video

# 3 étapes : prepare (tests, plan, audio, scène Blender, previews)
#            -> render (N machines en parallèle, chacune une tranche de frames)
#            -> finalize (assemblage MP4, Google Drive, historique)

on:
  workflow_dispatch:
    inputs:
      config_json:
        description: "Config complète en JSON (prioritaire sur les champs ci-dessous) - utilisé par la tâche quotidienne Claude"
        default: ""
      caption:
        description: "Légende TikTok/Instagram (déposée sur Drive à côté du MP4)"
        default: ""
      object_type:
        description: "Objet (mango, soap, jelly, chocolate)"
        default: "mango"
      target_piece_count:
        description: "Nombre final de morceaux"
        default: "15"
      cutting_mode:
        description: "cumulative ou levels"
        default: "cumulative"
      quality:
        description: "preview (540x960, rapide) ou final (1080x1920)"
        default: "preview"
      random_seed:
        description: "Seed (vide = aléatoire)"
        default: "42"
      frames_per_machine:
        description: "Frames par machine (moins = plus de machines en parallèle, max 16)"
        default: "40"

permissions:
  contents: write
  actions: write   # lets finalize delete intermediate artifacts (public repo)

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

env:
  DRIVE_FOLDER_ID: "1iyVCJ4oT4RdsRtiQWIOpO9P48u0gEzd7"   # Google Drive > ASMR Slicing Videos
  BLENDER_SERIES: "4.5"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      shards: ${{ steps.shards.outputs.list }}
      quality: ${{ steps.cfg.outputs.quality }}
      tag: ${{ steps.cfg.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-blender
      - name: Tests (incl. real Blender geometry, 15 pieces)
        run: python -m pytest tests -q

      - name: Config
        id: cfg
        env:
          CONFIG_JSON: ${{ inputs.config_json }}
        run: |
          python - <<'EOF'
          import json, random, os
          raw = os.environ.get("CONFIG_JSON", "").strip()
          if raw:
              cfg = json.loads(raw)
              quality = cfg.pop("quality", "${{ inputs.quality || 'preview' }}")
          else:
              seed = "${{ inputs.random_seed }}".strip()
              cfg = {
                "object_type": "${{ inputs.object_type || 'mango' }}",
                "target_piece_count": int("${{ inputs.target_piece_count || '15' }}"),
                "cutting_mode": "${{ inputs.cutting_mode || 'cumulative' }}",
                "random_seed": int(seed) if seed else random.randint(1, 10**6),
              }
              quality = "${{ inputs.quality || 'preview' }}"
          n = cfg["target_piece_count"]
          cfg.update({"render_engine": "cycles", "output_path": "runs",
                      "cycles_samples": 48 if n <= 500 else (32 if n <= 5000 else 20)})
          json.dump(cfg, open("ci_config.json", "w"), indent=1)
          tag = f"{cfg['object_type']}-{n}p"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"quality={quality}\ntag={tag}\n")
          print(cfg, quality)
          EOF

      - name: Plan + audio + Blender scene + previews
        env:
          CAPTION: ${{ inputs.caption }}
        run: |
          python scripts/run.py preview ci_config.json
          mv runs/*/ work
          cp ci_config.json work/ci_config.json
          printf '%s' "$CAPTION" > work/caption.txt

      - name: Split frames across machines
        id: shards
        run: echo "list=$(python scripts/run.py shards work ${{ inputs.frames_per_machine || '40' }})" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: workdir
          path: work/
          retention-days: 1

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: true
      matrix:
        frames: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-blender
      - uses: actions/download-artifact@v4
        with:
          name: workdir
          path: work
      - name: Render frames ${{ matrix.frames }}
        run: |
          if [ "${{ needs.prepare.outputs.quality }}" = "final" ]; then F=--final; else F=; fi
          python scripts/run.py render work $F --frames ${{ matrix.frames }}
      - name: Shard id
        id: sid
        run: echo "id=$(echo '${{ matrix.frames }}' | tr '-' '_')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ steps.sid.outputs.id }}
          path: work/frames/*.png
          retention-days: 1

  finalize:
    needs: [prepare, render]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      VIDEO_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Deps
        run: |
          pip install -q numpy scipy
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - uses: actions/download-artifact@v4
        with:
          name: workdir
          path: work
      - uses: actions/download-artifact@v4
        if: needs.render.result == 'success'
        with:
          pattern: frames-*
          path: work/frames
          merge-multiple: true

      - name: Export MP4
        if: needs.render.result == 'success'
        run: python scripts/run.py export work

      - name: Upload MP4 to Google Drive
        if: needs.render.result == 'success' && env.RCLONE_CONF != ''
        run: |
          sudo apt-get install -y -qq rclone > /dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          REMOTE=$(rclone listremotes | head -1)
          NAME="$(date -u +%Y-%m-%d)_${VIDEO_TAG}_run${GITHUB_RUN_NUMBER}"
          rclone copyto work/*.mp4 "${REMOTE}${NAME}.mp4" --drive-root-folder-id "$DRIVE_FOLDER_ID"
          if [ -s work/caption.txt ]; then
            rclone copyto work/caption.txt "${REMOTE}${NAME}_caption.txt" --drive-root-folder-id "$DRIVE_FOLDER_ID"
          fi
          echo "Uploaded ${NAME} to Google Drive"
          echo "DRIVE_OK=1" >> "$GITHUB_ENV"

      - name: Drive upload skipped
        if: env.RCLONE_CONF == ''
        run: echo "::warning::Secret RCLONE_CONF absent - MP4 disponible uniquement dans les Artifacts du run."

      - name: Record in history (used by the daily planner to avoid repeats)
        if: always()
        run: |
          python - <<'EOF'
          import json, os, datetime
          def load(name):
              try:
                  return json.load(open(os.path.join("work", name)))
              except Exception:
                  return {}
          cfg, rep, exp = load("ci_config.json"), load("blender_report.json"), load("export_report.json")
          cap = open("work/caption.txt", encoding="utf-8").read() if os.path.exists("work/caption.txt") else ""
          row = {"date": datetime.datetime.utcnow().isoformat(timespec="minutes") + "Z",
                 "run": int(os.environ["GITHUB_RUN_ID"]), "run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
                 "status": "ok" if exp.get("ok") else "failed",
                 "object": cfg.get("object_type"), "pieces": cfg.get("target_piece_count"),
                 "mode": cfg.get("cutting_mode"), "seed": cfg.get("random_seed"),
                 "hook": cfg.get("hook_text", ""), "end_text": cfg.get("end_text", ""), "caption": cap,
                 "validated_pieces": rep.get("final_pieces_validated"),
                 "duration_s": exp.get("duration_s"), "size_mb": exp.get("size_mb"),
                 "views": None, "likes": None, "comments": None}
          os.makedirs("history", exist_ok=True)
          with open("history/videos.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps(row, ensure_ascii=False) + "\n")
          print(row)
          EOF
          git config user.name "asmr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history/videos.jsonl
          git commit -m "history: run ${GITHUB_RUN_NUMBER} (${VIDEO_TAG})" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

      # Public repo: the video itself is only kept on GitHub when Drive upload did not happen
      - uses: actions/upload-artifact@v4
        if: always() && env.DRIVE_OK != '1'
        with:
          name: asmr-${{ needs.prepare.outputs.tag }}-${{ github.run_number }}-video
          path: work/*.mp4
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asmr-${{ needs.prepare.outputs.tag }}-${{ github.run_number }}-reports
          path: |
            work/previews/
            work/*.json
            work/blender.log
          if-no-files-found: warn
          retention-days: 3

      - name: Delete intermediate artifacts (scene + raw frames)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                        --jq '.artifacts[] | select(.name == "workdir" or (.name | startswith("frames-"))) | .id'); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" && echo "deleted $id"
          done
