name: Render ASMR video

on:
  workflow_dispatch:
    inputs:
      config_json:
        description: "Config complète en JSON (prioritaire sur les champs ci-dessous) - utilisé par la tâche quotidienne Claude"
        default: ""
      caption:
        description: "Légende TikTok/Instagram (déposée sur Drive à côté du MP4)"
        default: ""
      object_type:
        description: "Objet (mango, soap, jelly, chocolate)"
        default: "mango"
      target_piece_count:
        description: "Nombre final de morceaux"
        default: "15"
      cutting_mode:
        description: "cumulative ou levels"
        default: "cumulative"
      quality:
        description: "preview (540x960, rapide) ou final (1080x1920)"
        default: "preview"
      random_seed:
        description: "Seed (vide = aléatoire)"
        default: "42"
      blender_series:
        description: "Série Blender (ex. 4.5, 4.2)"
        default: "4.5"

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

env:
  DRIVE_FOLDER_ID: "1iyVCJ4oT4RdsRtiQWIOpO9P48u0gEzd7"   # Google Drive > ASMR Slicing Videos

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python deps + ffmpeg
        run: |
          pip install numpy scipy pytest
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 > /dev/null

      - name: Resolve Blender download
        id: bl
        run: |
          S="${{ inputs.blender_series || '4.5' }}"
          URL="https://download.blender.org/release/Blender${S}/"
          F=$(curl -fsSL "$URL" | grep -oE "blender-${S}\.[0-9]+-linux-x64\.tar\.xz" | sort -V | tail -1)
          test -n "$F" || { echo "No Blender build found for $S"; exit 1; }
          echo "file=$F" >> "$GITHUB_OUTPUT"
          echo "url=${URL}${F}" >> "$GITHUB_OUTPUT"

      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: ${{ steps.bl.outputs.file }}

      - name: Install Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -fsSL "${{ steps.bl.outputs.url }}" | tar -xJ -C ~/blender --strip-components=1

      - name: Tools check
        run: |
          echo "BLENDER_PATH=$HOME/blender/blender" >> "$GITHUB_ENV"
          BLENDER_PATH=$HOME/blender/blender python scripts/run.py check

      - name: Tests (incl. real Blender geometry, 15 pieces)
        run: python -m pytest tests -q

      - name: Config
        env:
          CONFIG_JSON: ${{ inputs.config_json }}
          CAPTION: ${{ inputs.caption }}
        run: |
          python - <<'EOF'
          import json, random, datetime, os
          event = os.environ["GITHUB_EVENT_NAME"]
          base = {"render_engine": "cycles", "cycles_samples": 48, "output_path": "runs"}
          raw = os.environ.get("CONFIG_JSON", "").strip()
          if raw:
              cfg = json.loads(raw)
              quality = cfg.pop("quality", "${{ inputs.quality || 'preview' }}")
          else:
              seed = "${{ inputs.random_seed }}".strip()
              cfg = {
                "object_type": "${{ inputs.object_type || 'mango' }}",
                "target_piece_count": int("${{ inputs.target_piece_count || '15' }}"),
                "cutting_mode": "${{ inputs.cutting_mode || 'cumulative' }}",
                "random_seed": int(seed) if seed else random.randint(1, 10**6),
              }
              quality = "${{ inputs.quality || 'preview' }}"
          n = cfg["target_piece_count"]
          base["cycles_samples"] = 48 if n <= 500 else (32 if n <= 5000 else 20)
          cfg.update(base)
          json.dump(cfg, open("ci_config.json", "w"), indent=1)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"QUALITY={quality}\n")
              f.write(f"VIDEO_TAG={cfg['object_type']}-{cfg['target_piece_count']}p\n")
          open("caption.txt", "w", encoding="utf-8").write(os.environ.get("CAPTION", ""))
          print(cfg, quality)
          EOF

      - name: Preview (plan + audio + Blender scene + stills)
        run: python scripts/run.py preview ci_config.json

      - name: Render frames
        run: |
          RD=$(ls -d runs/*/ | head -1)
          echo "RUN_DIR=$RD" >> "$GITHUB_ENV"
          if [ "$QUALITY" = "final" ]; then
            python scripts/run.py render "$RD" --final
          else
            python scripts/run.py render "$RD"
          fi

      - name: Export MP4
        run: |
          python scripts/run.py export "$RUN_DIR"
          cp caption.txt "$RUN_DIR"caption.txt

      - name: Upload MP4 to Google Drive
        if: ${{ env.RCLONE_CONF != '' }}
        run: |
          sudo apt-get install -y -qq rclone > /dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          REMOTE=$(rclone listremotes | head -1)
          D=$(date -u +%Y-%m-%d)
          for f in "$RUN_DIR"*.mp4; do
            NAME="${D}_${VIDEO_TAG}_run${GITHUB_RUN_NUMBER}"
            rclone copyto "$f" "${REMOTE}${NAME}.mp4" --drive-root-folder-id "$DRIVE_FOLDER_ID"
            if [ -s "$RUN_DIR"caption.txt ]; then
              rclone copyto "$RUN_DIR"caption.txt "${REMOTE}${NAME}_caption.txt" --drive-root-folder-id "$DRIVE_FOLDER_ID"
            fi
            echo "Uploaded ${NAME} to Google Drive folder $DRIVE_FOLDER_ID"
          done

      - name: Drive upload skipped
        if: ${{ env.RCLONE_CONF == '' }}
        run: echo "::warning::Secret RCLONE_CONF absent - MP4 disponible uniquement dans les Artifacts du run."

      - name: Record in history (used by the daily planner to avoid repeats)
        if: always()
        run: |
          python - <<'EOF'
          import json, os, glob, datetime
          rd = os.environ.get("RUN_DIR", "")
          def load(name):
              try:
                  return json.load(open(os.path.join(rd, name)))
              except Exception:
                  return {}
          cfg = json.load(open("ci_config.json"))
          rep, exp = load("blender_report.json"), load("export_report.json")
          row = {"date": datetime.datetime.utcnow().isoformat(timespec="minutes") + "Z",
                 "run": int(os.environ["GITHUB_RUN_ID"]), "run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
                 "status": "ok" if exp.get("ok") else "failed",
                 "object": cfg.get("object_type"), "pieces": cfg.get("target_piece_count"),
                 "mode": cfg.get("cutting_mode"), "seed": cfg.get("random_seed"),
                 "hook": cfg.get("hook_text", ""), "end_text": cfg.get("end_text", ""),
                 "caption": open("caption.txt", encoding="utf-8").read() if os.path.exists("caption.txt") else "",
                 "validated_pieces": rep.get("final_pieces_validated"),
                 "duration_s": exp.get("duration_s"), "size_mb": exp.get("size_mb"),
                 "views": None, "likes": None, "comments": None}
          os.makedirs("history", exist_ok=True)
          with open("history/videos.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps(row, ensure_ascii=False) + "\n")
          print(row)
          EOF
          git config user.name "asmr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history/videos.jsonl
          git commit -m "history: run ${GITHUB_RUN_NUMBER} (${VIDEO_TAG})" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

      - name: Upload video + previews + reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asmr-${{ env.VIDEO_TAG }}-${{ github.run_number }}
          path: |
            runs/*/*.mp4
            runs/*/previews/
            runs/*/*.json
            runs/*/soundtrack.wav
            runs/*/blender.log
          if-no-files-found: warn
          retention-days: 14
